<!DOCTYPE html>
<title>fortnite campfire</title>
<style>
    body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    video {
        height: 100%;
        min-height: 100%;
        width: 100%;
        min-width: 100%;
    }

    #play-icon {
        position: absolute;
    }
</style>
<video id="video-player" muted loop>
    <source src="./fc.mp4" type="video/mp4" />
</video>

<div id="play-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="5rem" height="5rem" fill="#fff" class="bi bi-play-fill"
        viewBox="0 0 16 16">
        <path
            d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z" />
    </svg>
</div>
<script>
    let isPlay = false;
    let audioContext = null;
    let audioBuffer = null;
    let audioSource = null;
    const videoPlayer = document.getElementById('video-player');
    const playIcon = document.getElementById('play-icon');

    // ページ読み込み時に音声ファイルをデコードしておく
    (async function loadAudio() {
        audioContext = new AudioContext();
        const response = await fetch('./fc.m4a');
        const arrayBuffer = await response.arrayBuffer();
        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    })();

    document.body.onclick = async function () {
        isPlay = !isPlay;
        if (isPlay) {
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.loop = true;
            audioSource.connect(audioContext.destination);
            audioSource.start(0);
            videoPlayer.play();
            playIcon.style.display = 'none';
        } else {
            if (audioSource) {
                audioSource.stop();
                audioSource = null;
            }
            videoPlayer.pause();
            playIcon.style.display = 'block';
        }
    }
</script>
<script type="module">
    import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk";

    // Discord SDKの初期化 (自身のClient IDに置き換えてください)
    const discordSdk = new DiscordSDK("1289296435514183791");

    async function setupDiscordSdk() {
        // SDKの準備が完了するのを待機
        await discordSdk.ready();

        // 1. Authorize (Discordクライアントに認証コードを要求)
        const { code } = await discordSdk.commands.authorize({
            client_id: "1289296435514183791",
            response_type: "code",
            state: "",
            prompt: "none",
            scope: ["identify", "rpc.activities.write"],
        });

        // 2. バックエンドサーバー経由でTokenを取得
        // CSP（セキュリティ）エラーを回避するため、Discordの「URL Mapping」機能を使います。
        // Discord Developer PortalのURL Mappingで「/api」をCloudflareのURLに向ける設定を行ってください。
        const WORKER_URL = '/api/token';

        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
        });
        const tokenData = await response.json();

        if (tokenData.error || !tokenData.access_token) {
            throw new Error("Failed to get access token");
        }

        // 3. Authenticate (取得したTokenで認証を完了)
        await discordSdk.commands.authenticate({ access_token: tokenData.access_token });

        // 4. Rich Presence (Activity) の設定
        await discordSdk.commands.setActivity({
            activity: {
                type: 3, // 0: Playing, 1: Streaming, 2: Listening, 3: Watching, 4: Custom, 5: Competing
                // details: "Warming up by the campfire",
                // state: "Listening to lofi",
                buttons: [
                    {
                        label: "Launch Fortnite",
                        url: "https://play.fn.gg/island/4110-6421-2257?pl=cr00001"
                    }
                ]
            }
        });
    }

    setupDiscordSdk().catch((err) => {
    });
</script>
